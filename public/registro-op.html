<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Registro de OP - Sistema de Produção</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>

<body>

    <header class="topbar">

    <a href="/" class="logo" aria-label="Página inicial do Sistema de Produção">

        <svg class="logo-icon"
             xmlns="http://www.w3.org/2000/svg"
             viewBox="0 0 64 64"
             fill="none"
             aria-hidden="true">

            <path d="M7 49V29L19 36V24L31 31V15H39V43H7Z"
                  fill="currentColor"/>

            <path d="M5 52H43"
                  stroke="currentColor"
                  stroke-width="4"
                  stroke-linecap="round"/>

            <circle cx="45" cy="20" r="12"
                    stroke="#58A6FF"
                    stroke-width="5"/>

            <circle cx="45" cy="20" r="4"
                    fill="#58A6FF"/>

            <path d="M45 3V7M45 33V37M28 20H32M58 20H62
                     M33 8L36 11M54 29L57 32M33 32L36 29M54 11L57 8"
                  stroke="#58A6FF"
                  stroke-width="4"
                  stroke-linecap="round"/>
        </svg>

        <span class="logo-text">
            <strong>Sistema de Produção</strong>
            <small>Automação e rastreabilidade</small>
        </span>

    </a>

    <div class="system-status">
        <span class="status-dot"></span>
        <span>Sistema online</span>
    </div>

</header>



    <main class="container">

        <div class="page-header">

            <div>

                <span class="section-label">
                    PRODUÇÃO
                </span>

                <h1>
                    Registro de OP
                </h1>

                <p>
                    Consulte as ordens de produção
                    e seus respectivos históricos.
                </p>

            </div>

            <a
                href="/"
                class="back-button"
            >
                ← Voltar
            </a>

        </div>


        <section class="panel">

            <div class="panel-header">

                <div>

                    <h3>
                        Ordens de produção
                    </h3>

                    <p>
                        Selecione uma OP para visualizar
                        seus detalhes.
                    </p>

                </div>

            </div>


            <div id="ordensRegistroContainer">

                <div class="empty-message">
                    Carregando ordens...
                </div>

            </div>

        </section>

    </main>


    <script src="/js/registro-op.js"></script>

</body>

</html>
