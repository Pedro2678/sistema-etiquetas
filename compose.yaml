
services:
  sistema-etiquetas:
    build: .
    container_name: sistema-etiquetas
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "file:/app/data/dev.db"
      NODE_ENV: production
    volumes:
      - etiquetas-data:/app/data
    restart: unless-stopped

volumes:
  etiquetas-data:
